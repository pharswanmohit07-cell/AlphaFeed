<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
<defs>
  <linearGradient id="bg" x1="150" y1="120" x2="1420" y2="900" gradientUnits="userSpaceOnUse">
    <stop stop-color="#071512"/>
    <stop offset=".45" stop-color="#07100f"/>
    <stop offset="1" stop-color="#030708"/>
  </linearGradient>
  <linearGradient id="frame" x1="180" y1="90" x2="1200" y2="880" gradientUnits="userSpaceOnUse">
    <stop stop-color="#3e5f59" stop-opacity=".9"/>
    <stop offset=".35" stop-color="#1d3934"/>
    <stop offset="1" stop-color="#0a1514"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#34d399" stop-opacity=".9"/>
    <stop offset="1" stop-color="#14b8a6" stop-opacity=".15"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#263a36" stop-opacity=".96"/>
    <stop offset="1" stop-color="#0b1715" stop-opacity=".98"/>
  </linearGradient>
  <filter id="blur40" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="40"/>
  </filter>
  <filter id="blur18" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
    <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000" flood-opacity=".55"/>
  </filter>
  <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
    <path d="M56 0H0V56" stroke="#77f7c6" stroke-opacity=".09"/>
  </pattern>
  <pattern id="tinyGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" stroke="#9fffe1" stroke-opacity=".06"/>
  </pattern>
</defs>

<rect width="1600" height="1000" fill="#04100d"/>
<ellipse cx="250" cy="230" rx="430" ry="330" fill="#16a37a" fill-opacity=".16" filter="url(#blur40)"/>
<ellipse cx="1370" cy="240" rx="250" ry="210" fill="#34d399" fill-opacity=".12" filter="url(#blur40)"/>
<rect width="1600" height="1000" fill="url(#grid)"/>

